{% extends "base.html" %}
{% from "_macros.html" import camp %}
{% block title %}Specializare{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h1 class="h3 mb-3">{{ 'Specializare nouă' if nou else 'Editare specializare' }}</h1>
  <div class="card"><div class="card-body">
    <form method="post">
      {{ camp('denumire', 'Denumire', item.denumire, required=true) }}
      <button class="btn btn-primary">Salvează</button>
      <a class="btn btn-link" href="{{ url_for('nomenclatoare.specializari_lista') }}">Renunță</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
